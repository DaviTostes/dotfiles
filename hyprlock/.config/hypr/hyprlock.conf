source = $HOME/.config/hypr/mocha.conf
$accent = $orange
$accentAlpha = $orangeAlpha
$font = Agave Nerd Font
$foreground = $text

# GENERAL
general {
    disable_loading_bar = true
    hide_cursor = true
}

# BACKGROUND
background {
    monitor =
    path = ~/.config/backgrounds/ayu-dark.png
    color = rgb(0a0a0a)
    blur_passes = 0
}

