# ===== VARIABLES =====
# Colors
$background = rgb(0a0a0a)
$backgroundFull = rgba(0a0a0aff)
$white = rgba(ffffffff)
$gray = rgba(c0c0c0ff)
$grayAlpha = rgba(80808088)
$darkGray = rgba(606060ff)
$lightGray = rgba(ccccccff)

# Typography
$font = Agave Nerd Font
$timeFontSize = 120
$dateFontSize = 22

# Layout positions
$timePositionY = 240
$datePositionY = 10
$inputPositionY = -210

# Input field
$inputWidth = 300
$inputHeight = 50
$outlineThickness = 2
$dotsSize = 0.25
$dotsSpacing = 0.3

# Image
$imagePath = ~/.config/backgrounds/ogylom.png

# ===== GENERAL =====
general {
    hide_cursor = true
}

# ===== BACKGROUND WIDGET =====
background {
    monitor =
    path = $imagePath
}

# ===== TIME LABEL WIDGET =====
label {
    monitor =
    text = $TIME
    color = $white
    font_size = $timeFontSize
    font_family = $font
    position = 0, $timePositionY
    halign = center
    valign = center
}

