# ===== INPUT FIELD WIDGET =====
input-field {
    monitor =
    size = $inputWidth, $inputHeight
    outline_thickness = $outlineThickness
    dots_size = $dotsSize
    dots_spacing = $dotsSpacing
    dots_center = true
    outer_color = $white
    inner_color = $backgroundFull
    font_color = $white
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff"></span>
    hide_input = false
    fail_color = $darkGray
    fail_text = <span foreground="##ff4444">failed</span>
    capslock_color = $lightGray
    position = 0, $inputPositionY
    halign = center
    valign = center
}
