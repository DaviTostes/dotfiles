# INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(ff8c4266)
    inner_color = rgba(0a0a0aff)
    font_color = rgba(ff8c42ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##ff8c42"></span>
    hide_input = false
    check_color = rgba(ff8c42ff)
    fail_color = rgba(ff4444ff)
    fail_text = <span foreground="##ff4444">failed</span>
    capslock_color = rgba(ffaa00ff)
    position = 0, -180
    halign = center
    valign = center
}
