# ===== INPUT FIELD WIDGET =====

input-field {
    monitor = 
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(ffffffff)
    inner_color = rgba(0a0a0aff)
    font_color = rgba(ffffffff)
    placeholder_text = <span foreground="#ffffff"></span>
    hide_input = false
    fail_color = rgb(ff4444)
    fail_text = wrong password
    check_color = $white
    capslock_color = rgb(5e5c64)
    position = 0, 150
    halign = center
    valign = bottom
}

