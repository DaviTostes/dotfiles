# ===== VARIABLES =====
# Colors
$background = rgb(0a0a0a)
$backgroundFull = rgba(0a0a0aff)
$white = rgba(ffffffff)
$gray = rgba(c0c0c0ff)
$grayAlpha = rgba(80808088)
$darkGray = rgba(606060ff)
$lightGray = rgba(ccccccff)

# Typography
$font = Agave Nerd Font
$timeFontSize = 80
$dateFontSize = 22

# Layout positions
$timePositionX = 10
$timePositionY = -10
$datePositionY = 10
$inputPositionY = 150

# Input field
$inputWidth = 300
$inputHeight = 50
$outlineThickness = 2
$dotsSize = 0.25
$dotsSpacing = 0.3

# Image
$imagePath = ~/.config/backgrounds/spiderman.jpg

# ===== GENERAL =====

general {
    hide_cursor = true
}

# ===== BACKGROUND WIDGET =====

background {
    monitor = 
    path = ~/.config/backgrounds/saturn-rings.jpg
}

# ===== TIME LABEL WIDGET =====

label {
    monitor = 
    text = $TIME
    color = rgba(ffffffff)
    font_size = 80
    font_family = Agave Nerd Font
    position = 0, 0
    halign = right
    valign = top
}

