$lock_timeout = 300
$dpms_timeout = 330

$lock = loginctl lock-session
$dpms_on = hyprctl dispatch 'hl.dsp.dpms("on")'
$dpms_off = hyprctl dispatch 'hl.dsp.dpms("off")'

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = $lock
    after_sleep_cmd = $dpms_on
}

listener {
    timeout = $lock_timeout
    on-timeout = $lock
}

listener {
    timeout = $dpms_timeout
    on-timeout = $dpms_off
    on-resume = $dpms_on
}
