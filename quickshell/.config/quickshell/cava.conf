# cava config used by the bar's Player pill (bar/Player.qml via the Cava
# singleton). It is passed explicitly with `cava -p`, so it never touches
# ~/.config/cava.
#
# Raw ASCII frames: one line per frame, `bar_delimiter`-separated levels in
# 0..ascii_max_range. Cava.qml reads them over stdout and drives the pill's
# vertical soundwave. Keep `bars` in sync with Cava.bars (11).

[general]
bars = 11
framerate = 60

[input]
# PipeWire is native here; switch to `pulse` (via pipewire-pulse) if the
# pipewire backend is unavailable.
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
